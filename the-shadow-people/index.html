<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Shadow People</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="author" content="Marcus Draper">
<meta name="description" content="A text adventure inspired by The Shadow People from the radio series Hall of Fantasy. By Marcus Draper for deskatur.com.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Layout: one lamp in a dark house. The story column sits in a pool of warm light that shrinks and cools as the shadows close in; a narrow side panel holds the light meter, what you carry, and the compass. */
:root {
  color-scheme: dark;
  --night: #0c0b0a;
  --panel: #15130f;
  --seam: #2a2620;
  --paper: #e7ddc7;
  --muted: #918676;
  --lamp: #f0b45b;
  --lamp-soft: rgba(240,180,91,.16);
  --cold: #8ea3b8;
  --blood: #c4573f;
  --display: "IM Fell English SC", "IM Fell English", Georgia, serif;
  --fell: "IM Fell English", Georgia, serif;
  --body: "Crimson Pro", Georgia, "Times New Roman", serif;
  --type: "Courier Prime", "Courier New", monospace;
  --pool: 1;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--night);
  color: var(--paper);
  font-family: var(--body);
  font-size: 18px;
  line-height: 1.55;
}
.app {
  position: relative;
  height: 100%;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  max-width: 1120px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 12px;
  box-sizing: border-box;
  gap: 12px;
}
.app::before {
  content: "";
  position: fixed; inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse calc(40% + 30% * var(--pool)) calc(45% + 35% * var(--pool)) at 38% 55%, rgba(240,180,91, calc(.10 * var(--pool))), transparent 70%);
  transition: background 1.2s ease;
  z-index: 0;
}
body.dark .app::before { background: radial-gradient(ellipse 30% 30% at 38% 60%, rgba(142,163,184,.05), transparent 70%); }
.app > * { position: relative; z-index: 1; }

header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 6px 20px; border-bottom: 1px solid var(--seam); padding-bottom: 10px; }
.kicker { font-family: var(--type); font-size: .72rem; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin: 0 0 2px; }
.kicker a { color: inherit; text-decoration: none; }
.kicker a:hover { color: var(--lamp); }
.byline { margin: 4px 0 0; font-family: var(--fell); font-style: italic; font-size: .95rem; color: var(--muted); }
.byline b { font-style: normal; font-weight: 400; color: var(--paper); }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(1.9rem, 6vw, 2.9rem); line-height: .95; margin: 0; color: var(--paper); text-shadow: 0 0 28px rgba(240,180,91,.25); }
.status { display: flex; flex-wrap: wrap; gap: 4px 18px; font-family: var(--type); font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.status b { color: var(--paper); font-weight: 700; }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 18px; min-height: 0; }
.story { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; gap: 10px; }
#log {
  overflow-y: auto;
  min-height: 0;
  padding: 6px 14px 18px 2px;
  scrollbar-width: thin;
  scrollbar-color: var(--seam) transparent;
}
#log .entry { max-width: 68ch; animation: rise .5s ease both; }
#log p { margin: 0 0 .75em; }
#log em { font-style: italic; color: #f1e6cc; }
#log .room { font-family: var(--display); font-size: 1.45rem; color: var(--lamp); margin: 1.1em 0 .25em; line-height: 1.1; }
body.dark #log .room { color: var(--cold); }
#log .cmd { font-family: var(--type); font-size: .9rem; color: var(--muted); margin: 1.2em 0 .5em; }
#log .cmd::before { content: "> "; color: var(--lamp); }
#log .note { font-family: var(--type); font-size: .82rem; color: var(--lamp); }
#log .dread { color: var(--cold); font-style: italic; }
#log .calm { color: var(--muted); font-style: italic; }
#log .event { border-left: 2px solid var(--lamp); padding-left: 12px; }
#log .voice { font-family: var(--fell); font-style: italic; color: #d9c7ff; }
#log .death { border-left: 2px solid var(--blood); padding-left: 12px; }
#log .end { font-family: var(--display); font-size: 1.3rem; text-align: center; color: var(--lamp); margin: 1em 0; }
#log .end.lost { color: var(--blood); }
#log .title { font-family: var(--display); font-size: 1.15rem; color: var(--muted); letter-spacing: .04em; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }

form.prompt { display: flex; align-items: center; gap: 10px; border: 1px solid var(--seam); background: rgba(0,0,0,.35); border-radius: 4px; padding: 8px 10px; }
form.prompt:focus-within { border-color: var(--lamp); box-shadow: 0 0 0 3px var(--lamp-soft); }
form.prompt span { font-family: var(--type); color: var(--lamp); font-weight: 700; }
#cmd { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--paper); font-family: var(--type); font-size: 1rem; }
#cmd::placeholder { color: #6c6357; }
form.prompt button { background: none; border: 1px solid var(--seam); color: var(--muted); font-family: var(--type); font-size: .8rem; border-radius: 3px; padding: 4px 10px; cursor: pointer; }

aside { display: grid; align-content: start; gap: 16px; overflow-y: auto; min-height: 0; padding-bottom: 8px; }
.box h2 { font-family: var(--type); font-size: .7rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
.meter { display: flex; align-items: center; gap: 10px; }
.bulb { width: 18px; height: 18px; border-radius: 50%; background: var(--lamp); box-shadow: 0 0 14px var(--lamp), 0 0 30px rgba(240,180,91,.4); transition: all .6s; flex: none; }
body.dark .bulb { background: transparent; border: 1px solid var(--cold); box-shadow: none; }
.meter b { font-family: var(--fell); font-size: 1.1rem; font-weight: 400; }
.pips { display: flex; gap: 4px; margin-top: 8px; }
.pip { flex: 1; height: 6px; border-radius: 2px; background: var(--seam); }
.pip.on { background: var(--cold); box-shadow: 0 0 8px rgba(142,163,184,.5); }
.pip.on.hot { background: var(--blood); box-shadow: 0 0 8px rgba(196,87,63,.6); }
.meter-note { font-size: .85rem; color: var(--muted); margin: 6px 0 0; }
#inv { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: .95rem; }
#inv li { display: flex; justify-content: space-between; gap: 8px; }
#inv small { color: var(--lamp); font-family: var(--type); font-size: .72rem; white-space: nowrap; }
#inv .none { color: var(--muted); font-style: italic; }

.compass { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.qbtn {
  font-family: var(--type); font-size: .82rem;
  padding: 8px 4px;
  background: var(--panel); color: var(--paper);
  border: 1px solid var(--seam); border-radius: 3px;
  cursor: pointer;
}
.qbtn:hover:not(:disabled) { border-color: var(--lamp); color: var(--lamp); }
.qbtn:disabled { opacity: .3; cursor: default; }
.qbtn.c { color: var(--muted); }
.verbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.credit { font-size: .82rem; color: var(--muted); line-height: 1.4; border-top: 1px solid var(--seam); padding-top: 10px; }
.credit a { color: var(--lamp); }
button:focus-visible, a:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }

@media (max-width: 800px) {
  body { font-size: 17px; }
  .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; gap: 10px; }
  aside { overflow: visible; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  aside .box.inv { display: none; }
  aside .credit { grid-column: 1 / -1; margin: 0; }
  aside .box.light { grid-column: 1 / -1; }
  .meter-note { display: none; }
  .pips { margin-top: 0; flex: 1; }
  .box.light { display: flex; align-items: center; gap: 12px; }
  .box.light h2 { display: none; }
  .qbtn { padding: 7px 2px; }
  #log { padding-right: 4px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<div class="app">
  <header>
    <div>
      <p class="kicker"><a href="https://www.deskatur.com" target="_blank" rel="noopener">www.deskatur.com</a> presents</p>
      <h1>The Shadow People</h1>
      <p class="byline">A text adventure by <b>Marcus Draper</b></p>
    </div>
    <div class="status" id="status"></div>
  </header>

  <div class="main">
    <section class="story">
      <div id="log" role="log" aria-live="polite" aria-label="Story"></div>
      <form class="prompt" id="form" autocomplete="off">
        <span aria-hidden="true">&gt;</span>
        <label for="cmd" style="position:absolute;left:-9999px">Command</label>
        <input id="cmd" type="text" placeholder="What do you do?" autocapitalize="off" spellcheck="false" enterkeyhint="send">
        <button type="submit">Enter</button>
      </form>
    </section>

    <aside>
      <div class="box light">
        <h2>Light</h2>
        <div class="meter"><span class="bulb" aria-hidden="true"></span><b id="lightLabel">Lit</b></div>
        <div class="pips" id="pips" aria-label="How close the shadows are"></div>
        <p class="meter-note" id="lightNote"></p>
      </div>
      <div class="box">
        <h2>Move</h2>
        <div class="compass" id="compass">
          <button class="qbtn c" type="button" data-cmd="up">Up</button>
          <button class="qbtn" type="button" data-cmd="north">N</button>
          <button class="qbtn c" type="button" data-cmd="down">Down</button>
          <button class="qbtn" type="button" data-cmd="west">W</button>
          <button class="qbtn c" type="button" data-cmd="look">Look</button>
          <button class="qbtn" type="button" data-cmd="east">E</button>
          <span></span>
          <button class="qbtn" type="button" data-cmd="south">S</button>
          <span></span>
        </div>
      </div>
      <div class="box">
        <h2>Act</h2>
        <div class="verbs">
          <button class="qbtn" type="button" data-cmd="inventory">Items</button>
          <button class="qbtn" type="button" data-cmd="wait">Wait</button>
          <button class="qbtn" type="button" data-cmd="hint">Hint</button>
          <button class="qbtn" type="button" data-cmd="undo">Undo</button>
          <button class="qbtn" type="button" data-cmd="save">Save</button>
          <button class="qbtn" type="button" data-cmd="restore">Load</button>
        </div>
      </div>
      <div class="box inv">
        <h2>Carrying</h2>
        <ul id="inv"></ul>
      </div>
      <p class="credit">An original interactive adaptation inspired by &ldquo;The Shadow People,&rdquo; an episode of the radio series <em>Hall of Fantasy</em>. Written by <b>Marcus Draper</b> for <a href="https://www.deskatur.com" target="_blank" rel="noopener">www.deskatur.com</a>.</p>
    </aside>
  </div>
</div>

<script>
(() => {
  /* ================= WORLD ================= */
  const MAX = 50;

  const ROOMS = {
    library: {
      name: "The Library", light: "lamp",
      exits: { e: "hallway" },
      desc: () => `Books climb three walls to the ceiling, their spines worn dull by years of your father's hands. His reading lamp stands beside the deep leather armchair${S.power && S.on.library ? ", throwing a single pool of yellow light. It is the only light in the whole house, you realise, unless you have switched on others" : ". The lamp is dark"}. A writing desk sits beneath the window, where the rain runs down the glass in ropes. The hallway door is east${isLitRoom("hallway") ? "." : ", and beyond it there is nothing but black."}`,
    },
    hallway: {
      name: "The Hallway", light: "hallSwitch",
      exits: { w: "library", e: "parlor", n: "dining", u: "landing", s: () => frontDoorExit() },
      desc: () => `A long hallway with a threadbare runner. The telephone waits on its little table at the foot of the stairs, and the tall clock ticks beside the front door to the south. The library is west, the parlor east, the dining room north. The stairs climb into the dark above.`,
    },
    dining: {
      name: "The Dining Room", light: "chandelier",
      exits: { s: "hallway", e: "kitchen" },
      desc: () => `A long table under a dust sheet, the sideboard against one wall, the chandelier hanging overhead like a spider that has stopped to listen. No one has eaten here since the funeral. The hallway is south and the kitchen east.`,
    },
    kitchen: {
      name: "The Kitchen", light: "kitchenLight",
      exits: { w: "dining", d: () => S.open.cellarDoor ? "cellar" : `The cellar door is shut${S.bolted.cellarDoor ? " and bolted" : ""}.` },
      desc: () => `A big stone-floored kitchen. The iron range is cold. Pantry shelves line the north wall, and in the far corner a narrow door leads down to the cellar${S.open.cellarDoor ? ". It stands open on a well of black" : S.bolted.cellarDoor ? ". Its bolt is shot home" : ""}. The dining room is west.`,
    },
    parlor: {
      name: "The Parlor", light: "parlorLight",
      exits: { w: "hallway" },
      desc: () => `The front parlor, all horsehair and lace, kept for visitors who no longer come. Father's portrait hangs above the cold fireplace. The hallway is west.` +
        (S.crane === "parlor" ? `\n\nMr. Crane has made a fortress of the place. Candles burn on every flat surface, and a circle of salt rings the sofa, where he sits with his notebook on his knee and an eye on the corners.` : ""),
    },
    landing: {
      name: "The Landing", light: "landingLight",
      exits: { d: "hallway", n: () => studyExit(), e: "bedroom", w: "fatherRoom" },
      desc: () => `The upstairs landing. Your bedroom is east and Father's bedroom west. North is the door to his study${S.open.studyDoor ? ", standing open" : S.locked.studyDoor ? ", locked since the funeral" : ", closed"}. The stairs lead down.`,
    },
    bedroom: {
      name: "Your Bedroom", light: "bedLight",
      exits: { w: "landing" },
      desc: () => `Your old room, unchanged since you came home for the funeral: a narrow bed, a nightstand, the rain against the window. The landing is west.`,
    },
    fatherRoom: {
      name: "Father's Bedroom", light: "fatherLight",
      exits: { e: "landing" },
      desc: () => `It still smells of bay rum and pipe smoke. There is a big walnut wardrobe, a nightstand, and the bed, made up tight by the undertaker's men. The landing is east.`,
    },
    study: {
      name: "Father's Study", light: "studyLight",
      exits: { s: "landing" },
      desc: () => `The room where he spent his last months. A rolltop desk under a green-shaded lamp, and papers everywhere: diagrams of lenses, coils of wire sketched in pencil, columns of figures headed CANDLEPOWER. A photograph is pinned above the desk. The landing is south.`,
    },
    cellar: {
      name: "The Cellar", light: "cellarBulb",
      exits: { u: "kitchen", e: () => S.open.workshopDoor ? "workshop" : "The heavy iron door to the workshop is closed." },
      desc: () => `Brick walls sweat in the damp. The coal bin slumps in one corner. The fuse box hangs on the wall at the foot of the stairs, and a bare bulb dangles overhead on a pull chain. To the east, a heavy iron door leads to Father's workshop${S.open.workshopDoor ? ". It stands open" : ""}. The stairs lead up.` +
        (S.saltLine ? `\n\nA thick white line of salt runs across the floor from wall to wall, guarding the stairs and the fuse box.` : ""),
    },
    workshop: {
      name: "The Workshop", light: null,
      exits: { w: "cellar" },
      desc: () => `Father's workshop. A workbench heaped with cable, carbon rods and pages of calculations. In the middle of the floor, on an iron stand with wheels, crouches ${S.sheetOff ? "Father's arc lamp: a great brass drum with a lens like a lighthouse eye" : "something tall under a dust sheet, shaped like a searchlight"}.\n\nAnd in the far wall, where the brick has been broken open, there is a seam of darkness that ${S.lampOn ? "even the white beam cannot quite fill" : "your light does not touch at all"}. It is not a shadow. It is a hole that shadows come out of. The cellar is west.`,
    },
  };

  // Items. loc = room id, item id (container), "player" or null.
  const ITEMS = {
    // Library
    lamp: { a: "the reading lamp", words: ["lamp", "reading", "light", "switch", "lights"], loc: "library", scenery: true, feel: true, switchFor: "library",
      desc: () => `A brass reading lamp with a fringed shade. Father read beneath it every night of your life. It is ${on("library")}.` },
    armchair: { a: "the armchair", words: ["armchair", "chair", "leather"], loc: "library", scenery: true,
      desc: () => `Deep, cracked leather. It still smells faintly of his pipe tobacco.` },
    novel: { a: "a novel", words: ["novel", "book"], loc: "library", initial: "A novel lies face-down on the arm of the chair, where you left it.",
      desc: () => `<em>The Lantern at Greymarsh</em>, a lurid thing from Father's shelves. You had read the same page four times.`,
      read: () => `You try. The words slide off the page. Every few lines your eyes go back to the doorway.` },
    libDesk: { a: "the writing desk", words: ["desk", "writing", "inkstand", "blotter"], loc: "library", scenery: true, opens: "libDrawer",
      desc: () => `Father's writing desk: a blotter, an inkstand, and one shallow drawer, which is ${S.open.libDrawer ? "open" : "closed"}. He kept candle ends in that drawer for storm season, when the power always went.` },
    libDrawer: { a: "the desk drawer", words: ["drawer", "desk"], loc: "library", scenery: true, container: true, openable: true,
      desc: () => `A shallow drawer in the writing desk. It is ${S.open.libDrawer ? "open" : "closed"}.` },
    card: { a: "a calling card", words: ["card", "calling", "business", "crane"], loc: "library", initial: "A calling card is propped against the inkstand on the desk.",
      desc: () => readCard(), read: () => readCard() },
    candle: { a: "a candle", words: ["candle", "stub", "wax"], loc: "libDrawer", light: true,
      desc: () => S.lit.candle ? `A stub of white candle, burning with a small brave flame. ${S.fuel.candle > 20 ? "It has a while left in it." : "It is burning low."}` : S.fuel.candle <= 0 ? "A puddle of cold wax around a blackened wick. It is finished." : "A stub of white candle, about three inches long." },
    matchbook: { a: "a book of matches", words: ["matches", "matchbook", "match"], loc: "libDrawer",
      desc: () => `A matchbook from the Hotel Belvedere. ${S.matches ? `${S.matches} match${S.matches > 1 ? "es" : ""} left.` : "It is empty."}` },
    shelves: { a: "the bookshelves", words: ["shelves", "books", "bookshelves", "bookcase", "spines"], loc: "library", scenery: true,
      desc: () => `Folklore, travel, chemistry, ghost stories. Father read everything. In his last months he read about only one thing: light.` },
    libWindow: { a: "the window", words: ["window", "glass", "rain"], loc: "library", scenery: true,
      desc: () => `Rain, and beyond the rain, nothing. Your own face looks back at you from the glass, pale above your black mourning dress.` },

    // Hallway
    hallSwitch: { a: "the light switch", words: ["switch", "light", "lights"], loc: "hallway", scenery: true, feel: true, switchFor: "hallway",
      desc: () => `A round brass switch beside the library door. The hall light is ${on("hallway")}.` },
    phone: { a: "the telephone", words: ["telephone", "phone", "receiver"], loc: "hallway", scenery: true, feel: true,
      desc: () => `A black candlestick telephone on its little table.${S.power ? "" : " Since the storm the line has been dead."}` },
    clock: { a: "the tall clock", words: ["clock", "grandfather", "tall"], loc: "hallway", scenery: true,
      desc: () => `Father wound it every Sunday. No one has wound it since he died, and yet it is still ticking.` },
    frontDoor: { a: "the front door", words: ["door", "front", "oak"], loc: "hallway", scenery: true, feel: true,
      desc: () => S.crane === "knocking" ? `Someone is hammering on it from outside.` : `Heavy oak, bolted for the night. Rain drums against it.` },
    stairs: { a: "the stairs", words: ["stairs", "staircase", "steps"], loc: "hallway", scenery: true, feel: true,
      desc: () => `They climb to the landing.` },

    // Dining
    chandelier: { a: "the chandelier", words: ["chandelier", "light", "switch", "lights"], loc: "dining", scenery: true, feel: true, switchFor: "dining",
      desc: () => `Brass arms and dusty crystal. It is ${on("dining")}.` },
    diningTable: { a: "the table", words: ["table", "sheet", "dust"], loc: "dining", scenery: true,
      desc: () => `The dust sheet hangs over it like a shroud.` },
    sideboard: { a: "the sideboard", words: ["sideboard", "silver", "decanter", "sherry"], loc: "dining", scenery: true,
      desc: () => `Silver, table linen, a decanter of Father's sherry. Nothing that will help you tonight.` },

    // Kitchen
    kitchenLight: { a: "the kitchen light", words: ["light", "switch", "lights", "bulb"], loc: "kitchen", scenery: true, feel: true, switchFor: "kitchen",
      desc: () => `A switch by the door. The kitchen light is ${on("kitchen")}.` },
    range: { a: "the range", words: ["range", "stove", "oven"], loc: "kitchen", scenery: true, desc: () => `Cold black iron.` },
    pantry: { a: "the pantry shelves", words: ["pantry", "shelf", "shelves"], loc: "kitchen", scenery: true, container: true, surface: true,
      desc: () => `Jars, tins and paper sacks.` },
    salt: { a: "a box of salt", words: ["salt", "box", "carton"], loc: "pantry", initial: "On the pantry shelf sits a big blue carton of cooking salt.",
      desc: () => S.saltLine ? `The carton of cooking salt, much lighter now.` : `A heavy carton of cooking salt, nearly full.` },
    lantern: { a: "a storm lantern", words: ["lantern", "storm", "oil", "hurricane"], loc: "pantry", light: true, initial: "An old storm lantern hangs from a hook beside the shelves.",
      desc: () => S.lit.lantern ? `The storm lantern, burning steady and bright behind its glass chimney.` : `An oil storm lantern with a glass chimney. The reservoir sloshes; it's full. You'd need a match to light it.` },
    cellarDoor: { a: "the cellar door", words: ["door", "cellar", "bolt"], loc: "kitchen", scenery: true, feel: true,
      desc: () => S.open.cellarDoor ? `The cellar door stands open on a well of black.` : S.bolted.cellarDoor ? `A narrow door in the corner. The bolt is shot home. You remember sliding it across the day after the funeral, your hands shaking.` : `A narrow door in the corner, closed. The bolt is drawn back.` },

    // Parlor
    parlorLight: { a: "the parlor lamps", words: ["lamps", "lamp", "light", "switch", "lights"], loc: "parlor", scenery: true, feel: true, switchFor: "parlor",
      desc: () => `Two tasselled lamps on a single switch. They are ${on("parlor")}.` },
    portrait: { a: "the portrait", words: ["portrait", "painting", "picture", "father", "edmund"], loc: "parlor", scenery: true,
